<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="popup.css" />
<title>Bulk Image Prompts</title>
</head>
<body>
  <header>
    <h1>Bulk Image Prompts</h1>
    <p class="sub">Har line = ek prompt. Images serial number ke saath download hongi.</p>
  </header>

  <label for="prompts">Prompts (one per line)</label>
  <textarea id="prompts" rows="8" placeholder="a cat astronaut in space&#10;sunset over mountains, cinematic&#10;cyberpunk street, neon rain"></textarea>

  <div class="row">
    <div class="field">
      <label for="prefix">File prefix</label>
      <input id="prefix" type="text" value="image" />
    </div>
    <div class="field">
      <label for="start">Start no.</label>
      <input id="start" type="number" value="1" min="0" />
    </div>
    <div class="field">
      <label for="pad">Digits</label>
      <input id="pad" type="number" value="3" min="1" max="6" />
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label for="folder">Download folder</label>
      <input id="folder" type="text" value="bulk-images" />
    </div>
    <div class="field">
      <label for="delay">Delay (ms)</label>
      <input id="delay" type="number" value="800" min="0" step="100" />
    </div>
  </div>

  <details>
    <summary>Advanced / API settings</summary>
    <label for="provider">Provider</label>
    <select id="provider">
      <option value="pollinations">Pollinations (free, no API key)</option>
      <option value="openai">OpenAI Images (API key needed)</option>
      <option value="custom">Custom URL template</option>
    </select>

    <div class="row">
      <div class="field">
        <label for="width">Width</label>
        <input id="width" type="number" value="1024" />
      </div>
      <div class="field">
        <label for="height">Height</label>
        <input id="height" type="number" value="1024" />
      </div>
      <div class="field">
        <label for="ext">Ext</label>
        <input id="ext" type="text" value="png" />
      </div>
    </div>

    <label for="apiKey">API key (OpenAI only)</label>
    <input id="apiKey" type="password" placeholder="sk-..." />

    <label for="model">Model</label>
    <input id="model" type="text" placeholder="gpt-image-1 / flux" />

    <label for="template">Custom URL template</label>
    <input id="template" type="text" placeholder="https://example.com/img?q={prompt}&w={width}&h={height}" />
    <p class="hint">Placeholders: {prompt} {width} {height} {seed} {index}</p>
  </details>

  <div class="actions">
    <button id="start-btn" class="primary">Start</button>
    <button id="stop-btn" class="ghost" disabled>Stop</button>
  </div>

  <div class="progress"><div id="bar"></div></div>
  <div id="status" class="status">Ready.</div>
  <ul id="log" class="log"></ul>

  <script src="popup.js"></script>
</body>
</html>
