<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Wash Explainer — 85 Scene Storyboard Gallery</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }
    header {
      max-width: 1200px;
      margin: 0 auto 2.5rem;
      text-align: center;
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }
    .action-bar {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 0.75rem;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
    }
    .btn-secondary {
      background: #334155;
      color: #fff;
    }
    .btn-secondary:hover {
      background: #475569;
      transform: translateY(-2px);
    }
    .gallery-grid {
      max-width: 1300px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.4);
      border-color: var(--accent);
    }
    .img-wrap {
      background: #fff;
      position: relative;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .card:hover .img-wrap img {
      transform: scale(1.03);
    }
    .badge {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      color: #38bdf8;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .card-body {
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }
    .scene-title {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.75rem;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }
    .download-link {
      font-size: 0.85rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .download-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎬 Car Wash Business Explainer</h1>
    <p class="subtitle">Complete 85-Scene Storyboard — 2D Hand-Drawn Editorial Style (PNG)</p>
    <div class="action-bar">
      <a href="all_85_scenes_png.zip" download="all_85_scenes_png.zip" class="btn btn-primary">
        📦 Download All 85 Images (ZIP)
      </a>
      <a href="https://github.com/digitalsanjeet/atex/tree/arena/01a093ef-atex/images" target="_blank" class="btn btn-secondary">
        🐙 View on GitHub
      </a>
    </div>
  </header>

  <main class="gallery-grid" id="gallery"></main>

  <script>
    const totalScenes = 85;
    const gallery = document.getElementById('gallery');
    
    for (let i = 1; i <= totalScenes; i++) {
      const num = String(i).padStart(2, '0');
      const filename = `images/scene_${num}.png`;
      
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="img-wrap">
          <span class="badge">SCENE ${num}</span>
          <img src="${filename}" alt="Scene ${num}" loading="lazy" />
        </div>
        <div class="card-body">
          <div class="scene-title">Scene ${num} Illustration</div>
          <div class="card-footer">
            <span style="font-size:0.8rem; color:var(--text-muted);">PNG Format</span>
            <a href="${filename}" download="scene_${num}.png" class="download-link">⬇ Download PNG</a>
          </div>
        </div>
      `;
      gallery.appendChild(card);
    }
  </script>
</body>
</html>
