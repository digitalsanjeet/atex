<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<title>Sam Story — 20 Images Download</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 24px; background: #f7f7f7; color: #222; }
  h1 { text-align: center; }
  .zip-btn { display: block; text-align: center; margin: 20px auto; }
  .zip-btn a { display: inline-block; background: #2563eb; color: #fff; padding: 16px 28px; font-size: 18px; border-radius: 10px; text-decoration: none; font-weight: 600; }
  .zip-btn a:hover { background: #1d4ed8; }
  .note { text-align: center; color: #555; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; }
  .card img { width: 100%; display: block; height: auto; aspect-ratio: 16/9; object-fit: cover; cursor: pointer; }
  .card a.title { display: block; padding: 8px 10px; font-size: 13px; text-align: center; color: #333; text-decoration: none; border-top: 1px solid #eee; background: #fafafa; }
  .card a.title:hover { background: #eef; }
</style>
</head>
<body>
  <h1>Sam की कहानी — 20 Images</h1>

  <div class="grid" id="grid"></div>

    });
